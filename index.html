<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Web Cafe - Layout Samping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Kedai Kopi 160</h1>
        <p>Seduhan asli, nikmatnya pasti.</p>
    </div>

    <div class="container">
        <!-- Baris Atas -->
        <div class="menu-item">
            <img src="ekspreso.webp">
            <div class="konten-teks">
                <h3>Espresso</h3>
                <p>Kecil bendanya, besar energinya</p>
                <div class="harga">Rp 15.000</div>
            </div>
        </div>

        <div class="menu-item">
            <img src="kopisusu.jpg">
            <div class="konten-teks">
                <h3>Kopi Susu</h3>
                <p>Manis dan segar</p>
                <div class="harga">Rp 10.000</div>
            </div>
        </div>

        <!-- Baris Bawah -->
        <div class="menu-item">
            <img src="rotibakar.webp">
            <div class="konten-teks">
                <h3>Roti Bakar</h3>
                <p>Camilan teman kopi.</p>
                <div class="harga">Rp 12.000</div>
            </div>
        </div>

        <div class="menu-item">
            <img src="panconglumer.webp">
            <div class="konten-teks">
                <h3>Pancong Lumer</h3>
                <p>Kenyang dan murah.</p>
                <div class="harga">Rp 8.000</div>
            </div>
        </div>
    </div>

    <div class="footer">
       
    </div>

</body>
</html>
